table:
  name: accounts
  schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns:
        - id
        - name
        - type
        - opening_balance
        - opening_date
        - archived_at
        - version
        - created_at
        - updated_at
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - name
        - type
        - opening_balance
        - opening_date
        - archived_at
        - version
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - type
        - opening_balance
        - opening_date
        - archived_at
        - version
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
