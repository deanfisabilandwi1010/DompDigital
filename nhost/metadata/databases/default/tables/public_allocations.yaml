table:
  name: allocations
  schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns:
        - id
        - date
        - from_pocket_id
        - to_pocket_id
        - amount
        - note
        - status
        - enforce_funds
        - version
        - created_at
        - updated_at
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - date
        - from_pocket_id
        - to_pocket_id
        - amount
        - note
        - status
        - enforce_funds
        - version
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - date
        - from_pocket_id
        - to_pocket_id
        - amount
        - note
        - status
        - enforce_funds
        - version
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
