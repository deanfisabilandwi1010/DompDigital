table:
  name: transactions
  schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns:
        - id
        - type
        - date
        - amount
        - account_id
        - destination_account_id
        - category_id
        - pocket_id
        - original_expense_id
        - group_id
        - note
        - tags
        - priority
        - behavior
        - status
        - version
        - created_at
        - updated_at
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - type
        - date
        - amount
        - account_id
        - destination_account_id
        - category_id
        - pocket_id
        - original_expense_id
        - group_id
        - note
        - tags
        - priority
        - behavior
        - status
        - version
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - type
        - date
        - amount
        - account_id
        - destination_account_id
        - category_id
        - pocket_id
        - original_expense_id
        - group_id
        - note
        - tags
        - priority
        - behavior
        - status
        - version
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
