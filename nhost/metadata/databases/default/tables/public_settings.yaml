table:
  name: settings
  schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: X-Hasura-User-Id
      columns:
        - display_name
        - timezone
        - reduced_motion
        - hide_amounts
        - budget_warn_pct
        - last_backup_at
        - onboarded_at
        - version
select_permissions:
  - role: user
    permission:
      columns:
        - user_id
        - display_name
        - timezone
        - reduced_motion
        - hide_amounts
        - budget_warn_pct
        - last_backup_at
        - onboarded_at
        - version
      filter:
        user_id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - display_name
        - timezone
        - reduced_motion
        - hide_amounts
        - budget_warn_pct
        - last_backup_at
        - onboarded_at
        - version
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
